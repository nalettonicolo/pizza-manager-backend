<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Aggiornamento PizzaManager</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  /* Finestra piccola e a dimensione fissa (non ridimensionabile): niente scrollbar, mai — se il
     contenuto crescesse (es. un messaggio d'errore lungo) va troncato in CSS, non scrollato. */
  html, body { overflow: hidden; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #14171f;
    color: #f4f6fb;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Niente "drag" sul corpo: la finestra ha già la barra del titolo di Windows per spostarla,
       e un'area trascinabile che copre tutto il contenuto può interferire con i clic (un clic
       interpretato come trascinamento) — bug osservato: un clic sulla finestra chiudeva l'app. */
    user-select: none;
  }
  .card {
    width: 100%;
    padding: 28px 30px;
  }
  .icon {
    font-size: 30px;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  p.status {
    font-size: 12.5px;
    color: #9aa3b8;
    margin: 0 0 16px;
    min-height: 16px;
  }
  .track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: #262b38;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #e8603c, #c0392b);
    transition: width 0.25s ease;
  }
  .fill.indeterminate {
    width: 40% !important;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { margin-left: -40%; }
    100% { margin-left: 100%; }
  }
  .row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11.5px;
    color: #6b7280;
  }
  .actions {
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    -webkit-app-region: no-drag;
  }
  button {
    -webkit-app-region: no-drag;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  button.primary {
    background: linear-gradient(90deg, #e8603c, #c0392b);
    color: #fff;
  }
  button.ghost {
    background: transparent;
    color: #9aa3b8;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🍕</div>
    <h1 id="title">Aggiornamento disponibile</h1>
    <p class="status" id="status">Controllo in corso…</p>
    <div class="track"><div class="fill indeterminate" id="fill"></div></div>
    <div class="row">
      <span id="percentLabel">&nbsp;</span>
      <span id="sizeLabel">&nbsp;</span>
    </div>
    <div class="actions">
      <button type="button" class="ghost" id="laterBtn" hidden>Più tardi</button>
      <button type="button" class="primary" id="restartBtn" hidden>Riavvia e installa</button>
    </div>
  </div>
  <script>
    const titleEl = document.getElementById("title")
    const statusEl = document.getElementById("status")
    const fillEl = document.getElementById("fill")
    const percentEl = document.getElementById("percentLabel")
    const sizeEl = document.getElementById("sizeLabel")
    const restartBtn = document.getElementById("restartBtn")
    const laterBtn = document.getElementById("laterBtn")

    function fmtMB(bytes) {
      if (!bytes && bytes !== 0) return ""
      return (bytes / (1024 * 1024)).toFixed(1) + " MB"
    }

    window.updateBridge?.onStatus((payload) => {
      const { state } = payload || {}
      if (state === "available") {
        titleEl.textContent = "Aggiornamento disponibile"
        statusEl.textContent = `Scaricamento versione ${payload.version} in corso…`
        fillEl.classList.add("indeterminate")
      } else if (state === "downloading") {
        titleEl.textContent = "Aggiornamento in corso"
        statusEl.textContent = "Download in corso…"
        fillEl.classList.remove("indeterminate")
        const pct = Math.max(0, Math.min(100, Math.round(payload.percent || 0)))
        fillEl.style.width = pct + "%"
        percentEl.textContent = pct + "%"
        sizeEl.textContent = `${fmtMB(payload.transferred)} / ${fmtMB(payload.total)}`
      } else if (state === "downloaded") {
        titleEl.textContent = "Aggiornamento pronto"
        statusEl.textContent = `Versione ${payload.version} scaricata: riavvia per installarla.`
        fillEl.classList.remove("indeterminate")
        fillEl.style.width = "100%"
        percentEl.textContent = "100%"
        restartBtn.hidden = false
        laterBtn.hidden = false
      } else if (state === "error") {
        titleEl.textContent = "Aggiornamento non riuscito"
        statusEl.textContent = payload.message || "Riprova più tardi."
        fillEl.classList.remove("indeterminate")
        fillEl.style.width = "0%"
        laterBtn.hidden = false
        laterBtn.textContent = "Chiudi"
      }
    })

    restartBtn.addEventListener("click", () => window.updateBridge?.restartAndInstall())
    laterBtn.addEventListener("click", () => window.updateBridge?.dismiss())
  </script>
</body>
</html>
