<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>PizzaManager — modello post verticale</title>
  <desc>Modello 1080x1350 (4:5) con segnaposto tra parentesi quadre da sostituire. Nessun prezzo.</desc>
  <rect width="1080" height="1350" fill="#faf7f2"/>
  <circle cx="940" cy="170" r="280" fill="#c0392b" fill-opacity="0.08"/>
  <circle cx="80" cy="860" r="190" fill="#d35400" fill-opacity="0.08"/>

  <!-- Logo -->
  <g transform="translate(90 110) scale(0.2344)">
    <rect width="512" height="512" rx="112" fill="#c0392b"/>
    <path fill-rule="evenodd" fill="#faf7f2" d="M69 148H160C208 148 236 176 236 220S208 294 160 294H116V348H69Z M116 191V251H158C178 251 189 240 189 221S178 191 158 191Z"/>
    <path fill="#faf7f2" d="M253 148H295L350 223L408 148H446V348H399V236L350 299L300 233V348H253Z"/>
    <rect x="69" y="380" width="369" height="18" rx="9" fill="#d35400"/>
  </g>
  <text x="230" y="186" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#241a12">PizzaManager</text>

  <!-- Titolo (segnaposto) -->
  <rect x="90" y="500" width="120" height="10" rx="5" fill="#d35400"/>
  <text x="90" y="640" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="84" font-weight="800" fill="#241a12">[Titolo del post]</text>
  <text x="90" y="740" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="84" font-weight="800" fill="#c0392b">[riga in evidenza]</text>
  <text x="90" y="840" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="600" fill="#241a12" fill-opacity="0.64">[Testo breve: una frase,</text>
  <text x="90" y="888" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="600" fill="#241a12" fill-opacity="0.64">massimo 20 parole]</text>

  <!-- Claim -->
  <text x="90" y="1055" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#241a12" fill-opacity="0.64">La tua pizzeria, finalmente sotto controllo.</text>

  <!-- Banda invito all'azione -->
  <rect x="0" y="1110" width="1080" height="240" fill="#c0392b"/>
  <text x="90" y="1210" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" fill="#faf7f2">Richiedi informazioni</text>
  <text x="90" y="1272" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="600" fill="#faf7f2">[indirizzo web]</text>
</svg>
