<svg width="1640" height="624" viewBox="0 0 1640 624" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>PizzaManager — modello copertina Facebook (1640 × 624, doppio di 820 × 312)</title>
  <desc>Modello di lancio. Il contenuto sta nella zona centrale (da x 480 a x 1460) per non essere tagliato da telefono e dalla foto profilo a sinistra. I riquadri tratteggiati sono segnaposto. Nessun prezzo.</desc>

  <!-- Fondo e forme (solo colori del brief, con trasparenza) -->
  <rect width="1640" height="624" fill="#faf7f2"/>
  <circle cx="1500" cy="40" r="300" fill="#c0392b" fill-opacity="0.08"/>
  <circle cx="160" cy="560" r="230" fill="#d35400" fill-opacity="0.08"/>

  <!-- Marchio + nome -->
  <g transform="translate(480,110) scale(0.3125)">
    <rect width="512" height="512" rx="112" fill="#c0392b"/>
    <path fill="#faf7f2" d="M108 112h140c82 0 134 46 134 126s-52 126-134 126H172v86H108V112zm64 58v136h70c44 0 70-24 70-68s-26-68-70-68H172z"/>
    <path fill="#faf7f2" d="M302 438V232l48 98 48-98v206h-50V334l-23 46-23-46v104h-50z"/>
    <rect x="108" y="456" width="296" height="18" rx="9" fill="#d35400"/>
  </g>
  <text x="665" y="215" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="5" fill="#241a12">PIZZAMANAGER</text>

  <!-- Claim -->
  <text x="480" y="335" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="600" fill="#241a12">La tua pizzeria, finalmente <tspan font-weight="800" fill="#c0392b">sotto controllo.</tspan></text>
  <rect x="480" y="362" width="120" height="10" rx="5" fill="#d35400"/>

  <!-- Segnaposto testo breve e sito -->
  <rect x="480" y="410" width="960" height="76" rx="16" fill="none" stroke="#241a12" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="960" y="458" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#241a12" fill-opacity="0.75">[Testo breve: 1 riga, es. un invito o una data]</text>
  <rect x="480" y="510" width="380" height="56" rx="14" fill="none" stroke="#241a12" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="670" y="548" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#241a12" fill-opacity="0.75">[sito web]</text>
</svg>
