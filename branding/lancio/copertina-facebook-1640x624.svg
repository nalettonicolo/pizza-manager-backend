<svg width="1640" height="624" viewBox="0 0 1640 624" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>PizzaManager — copertina Facebook</title>
  <desc>Copertina 1640x624 (doppio di 820x312). Contenuto nella zona sicura x 420–1220: la foto profilo copre in basso a sinistra, il telefono ritaglia i lati. Nessun prezzo.</desc>
  <rect width="1640" height="624" fill="#faf7f2"/>
  <circle cx="1500" cy="60" r="320" fill="#c0392b" fill-opacity="0.08"/>
  <circle cx="140" cy="600" r="200" fill="#d35400" fill-opacity="0.08"/>

