# CI automatica su GitHub: ogni push / pull request su main esegue lint, test e build.
# Abilita "Actions" nel repo se disattivate. Per deploy hosting (Firebase) servono secrets dedicati (workflow separato).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Nest (pizzeria-backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/pizzeria-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/pizzeria-backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  frontend:
    name: Vite (SPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint, test, build
        run: npm run ci:frontend
        env:
          # Placeholder per build Vite in CI (nessuna chiamata reale in pipeline)
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.ci-placeholder
          VITE_API_URL: http://127.0.0.1:3001
          VITE_GOOGLE_MAPS_API_KEY: ""
          VITE_USE_NEST_AUTH: "false"
          VITE_PUBLIC_TENANT_VIA_NEST: "false"
          VITE_PUBLIC_STOREFRONT_VIA_NEST: "false"

  security-dependencies:
    name: Runtime dependency security gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [".", "server/pizzeria-backend"]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.directory == '.' && 'package-lock.json' || 'server/pizzeria-backend/package-lock.json' }}

      - name: Install
        run: npm ci

      - name: Block critical runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
