# Mantiene attivo il progetto Supabase Free (pausa dopo ~7 giorni senza traffico API).
# Esegue un ping leggero circa ogni 5 giorni di calendario (giorni 1, 6, 11, 16, 21, 26 alle 08:00 UTC).
#
# Secrets richiesti nel repo GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL          es. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY     chiave anon (Settings → API nel progetto Supabase)

name: Supabase keep-alive

on:
  schedule:
    # 08:00 UTC — giorni 1, 6, 11, 16, 21, 26 di ogni mese (~ogni 5 giorni)
    - cron: "0 8 1,6,11,16,21,26 * *"
  workflow_dispatch:
  # Verifica dopo modifiche allo script/workflow (non sostituisce il cron)
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-keepalive.yml"
      - "scripts/supabase-keepalive.mjs"

permissions:
  contents: read

jobs:
  ping:
    name: Ping API Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verifica secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Manca il secret SUPABASE_URL. Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Secret SUPABASE_ANON_KEY assente: il ping userà solo auth/health."
          fi
          echo "SUPABASE_URL impostata (${#SUPABASE_URL} caratteri)."

      - name: Keep-alive ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/supabase-keepalive.mjs
