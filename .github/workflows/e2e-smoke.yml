# E2E smoke pubblico post-deploy (P4)

name: E2E smoke (public)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright public smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Smoke public pages
        run: npm run e2e:smoke
        env:
          E2E_BASE_URL: https://pizzamanager.it
